[project]
name = "code-reviewer"
version = "0.1.0"
description = "AI Code Reviewer for GitLab. Fork from https://github.com/AnyMaint/code-reviewer"
authors = [
    {name = "Sergey Sedov",email = "ssedov@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "openai (==1.70.0)",
    "python-gitlab (==5.6.0)",
    "python-dotenv (>=1.1.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
